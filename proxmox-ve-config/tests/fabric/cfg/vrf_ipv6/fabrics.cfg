bgp_fabric: bgpred
        bfd 0
        ip6_prefix fd00:10::/64
        route_map_in red-in
        route_map_out red-out
        zone red

bgp_fabric: bgpblue
        bfd 0
        ip_prefix 10.1.0.0/24
        ip6_prefix fd00:20::/64
        zone blue

bgp_node: bgpred_pve
        asn 65001
        interfaces name=ens18
        ip6 fd00:10::1
        role internal

bgp_node: bgpblue_pve
        asn 65002
        interfaces name=ens19
        ip 10.1.0.1
        ip6 fd00:20::1
        role internal
